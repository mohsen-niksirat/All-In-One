<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mini Apps | Telegram</title>
    <meta name="theme-color" content="#50a9e8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="All-In-One">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="apple-touch-icon" type="image/png" href="icons/icon-192.png">
    <link rel="stylesheet" href="core/ui.css">
    <link rel="stylesheet" href="launcher.css">
</head>
<body>
    <header class="launcher-header">
        <div class="logo">🧩</div>
        <div class="header-text">
            <h1 data-i18n="hub_title">Mini Apps</h1>
            <p id="greeting" data-i18n="hub_sub">Free serverless mini apps</p>
        </div>
        <div class="header-actions">
            <div data-lang-switcher class="lang-switcher"></div>
            <span id="version-badge" class="version-badge" title="All-In-One">v2.0.0</span>
        </div>
    </header>

    <main class="launcher-main">
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input id="search" type="search" data-i18n-placeholder="hub_search" placeholder="Search apps..." autocomplete="off">
        </div>
        <div id="stats" class="stats"></div>
        <div id="app-grid" class="app-grid"></div>
    </main>

    <!-- App info / about sheet -->
    <div id="app-sheet" class="modal-overlay hidden">
        <div class="modal-box sheet-box" id="sheet-box"></div>
    </div>

    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Core layer -->
    <script src="core/tg.js"></script>
    <script src="core/store.js"></script>
    <script src="core/i18n.js"></script>

    <!-- Registry + launcher -->
    <script src="apps/registry.js"></script>
    <script src="launcher.js"></script>
</body>
</html>

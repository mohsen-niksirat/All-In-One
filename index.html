<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mini Apps | Telegram</title>
    <meta name="theme-color" content="#50a9e8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="All-In-One">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="apple-touch-icon" type="image/png" href="icons/icon-192.png">
    <link rel="stylesheet" href="core/ui.css">
    <link rel="stylesheet" href="launcher.css">
</head>
<body>
    <header class="launcher-header">
        <div class="logo">🧩</div>
        <div class="header-text">
            <h1 data-i18n="hub_title">Mini Apps</h1>
            <p id="greeting" data-i18n="hub_sub">Free serverless mini apps</p>
        </div>
        <div class="header-actions">
            <div data-lang-switcher class="lang-switcher"></div>
            <button type="button" id="backup-btn" class="icon-btn" data-i18n-title="hub_backup_btn" title="Data & backups">💾</button>
            <button type="button" id="refresh-btn" class="icon-btn" data-i18n-title="hub_refresh_title" title="Check for updates">↻</button>
            <span id="version-badge" class="version-badge" title="All-In-One"></span>
        </div>
        <div id="pull-hint" class="pull-hint" aria-hidden="true"></div>
    </header>

    <main class="launcher-main">
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input id="search" type="search" data-i18n-placeholder="hub_search" placeholder="Search apps..." autocomplete="off">
        </div>
        <div id="stats" class="stats"></div>

        <!-- Backup reminder bar (shown when an app with data is overdue) -->
        <div id="backup-bar" class="backup-bar hidden" role="note">
            <span class="backup-bar-ico">💾</span>
            <div class="backup-bar-txt">
                <div id="backup-bar-title" class="backup-bar-title"></div>
                <div id="backup-bar-sub" class="backup-bar-sub"></div>
            </div>
            <button type="button" id="backup-bar-btn" class="btn btn-secondary bk-small">Back up</button>
            <button type="button" id="backup-bar-x" class="backup-x" data-i18n-title="hub_backup_dismiss" title="Not now">✕</button>
        </div>

        <div id="app-grid" class="app-grid"></div>
    </main>

    <input type="file" id="bk-import-file" accept=".json,application/json" hidden>

    <!-- App info / about sheet -->
    <div id="app-sheet" class="modal-overlay hidden">
        <div class="modal-box sheet-box" id="sheet-box"></div>
    </div>

    <!-- Changelog sheet (opens from the version badge) -->
    <div id="changelog-sheet" class="modal-overlay hidden">
        <div class="modal-box sheet-box" id="changelog-box"></div>
    </div>

    <!-- Data & backups sheet (opens from the 💾 header button) -->
    <div id="backup-sheet" class="modal-overlay hidden">
        <div class="modal-box sheet-box" id="backup-box"></div>
    </div>

    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Core layer -->
    <script src="core/tg.js"></script>
    <script src="core/store.js"></script>
    <script src="core/i18n.js"></script>
    <script src="core/backup.js"></script>

    <!-- Registry + changelog + launcher -->
    <script src="apps/registry.js"></script>
    <script src="apps/changelog.js"></script>
    <script src="launcher.js"></script>
</body>
</html>

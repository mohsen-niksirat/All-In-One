<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Markdown Preview</title>
    <link rel="stylesheet" href="../../core/ui.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <a class="back-btn" href="../../" data-i18n-title="md_back" title="Back to apps">‹</a>
        <h1 data-i18n="md_title">Markdown Preview</h1>
        <div data-lang-switcher class="lang-switcher"></div>
    </header>

    <main class="app-page">
        <!-- Mobile tabs -->
        <div class="md-tabs">
            <button id="tab-write" class="md-tab active" data-i18n="md_write">Write</button>
            <button id="tab-preview" class="md-tab" data-i18n="md_preview">Preview</button>
        </div>

        <!-- Panes -->
        <div class="md-panes">
            <div id="pane-write" class="md-pane">
                <textarea id="md-input" rows="14" data-i18n-placeholder="md_placeholder" placeholder="Write markdown here..."># Hello 👋

**Bold**, *italic*, `inline code`

- item one
- item two

> A quote

[link](https://example.com)</textarea>
            </div>
            <div id="pane-preview" class="md-pane hidden">
                <div id="md-preview" class="md-preview"></div>
            </div>
        </div>

        <!-- Footer -->
        <div class="md-footer">
            <span id="word-count" class="word-count"></span>
            <button id="copy-html" class="clear-btn" data-i18n="md_copy_html">Copy HTML</button>
        </div>
    </main>

    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Core layer -->
    <script src="../../core/tg.js"></script>
    <script src="../../core/store.js"></script>
    <script src="../../core/i18n.js"></script>

    <!-- App -->
    <script src="app.js"></script>
</body>
</html>

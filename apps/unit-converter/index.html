<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Unit Converter</title>
    <link rel="stylesheet" href="../../core/ui.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <a class="back-btn" href="../../" data-i18n-title="unit_back" title="Back to apps">‹</a>
        <h1 data-i18n="unit_title">Unit Converter</h1>
        <div data-lang-switcher class="lang-switcher"></div>
    </header>

    <main class="app-page">
        <!-- Category tabs -->
        <div class="cat-tabs" id="cat-tabs"></div>

        <!-- Converter -->
        <div class="converter card">
            <div class="field">
                <label data-i18n="unit_value">Value</label>
                <input type="number" id="value-input" value="1" step="any" inputmode="decimal">
            </div>

            <div class="field">
                <label data-i18n="unit_from">From</label>
                <select id="from-select"></select>
            </div>

            <button id="swap-btn" class="swap-btn" data-i18n-title="unit_swap" title="Swap">⇅</button>

            <div class="field">
                <label data-i18n="unit_to">To</label>
                <select id="to-select"></select>
            </div>

            <div class="result-box">
                <div class="result-label" data-i18n="unit_result">Result</div>
                <div id="result" class="result-value">—</div>
            </div>
        </div>
    </main>

    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Core layer -->
    <script src="../../core/tg.js"></script>
    <script src="../../core/store.js"></script>
    <script src="../../core/i18n.js"></script>

    <!-- Pure conversion logic -->
    <script src="converter.js"></script>

    <!-- App -->
    <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Translator</title>
    <link rel="stylesheet" href="../../core/ui.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <a class="back-btn" href="../../" data-i18n-title="trs_back" title="Back to apps">‹</a>
        <h1 data-i18n="trs_title">Translator</h1>
        <div data-lang-switcher class="lang-switcher"></div>
    </header>

    <main class="app-page">
        <!-- Language pair -->
        <div class="pair-row">
            <select id="from" class="lang-select" aria-label="Source language" data-i18n-aria-label="trs_from_label"></select>
            <button id="swap" class="icon-btn" data-i18n-title="trs_swap" title="Swap">⇄</button>
            <select id="to" class="lang-select" aria-label="Target language" data-i18n-aria-label="trs_to_label"></select>
        </div>

        <!-- Input -->
        <textarea id="src" rows="4" data-i18n-placeholder="trs_ph" placeholder="Text to translate..." maxlength="450"></textarea>
        <div class="hint-row">
            <span class="counter" id="counter">0/450</span>
            <span class="limit-note" data-i18n="trs_note">Free service — 5,000 chars/day</span>
        </div>

        <button id="translate-btn" class="btn btn-primary btn-block" data-i18n="trs_btn">Translate</button>

        <!-- Output -->
        <div id="result-wrap" class="result-wrap hidden">
            <div id="result" class="result" dir="auto"></div>
            <div class="result-actions">
                <button id="copy-btn" class="btn btn-secondary" data-i18n="trs_copy">Copy</button>
                <button id="speak-btn" class="btn btn-secondary" data-i18n="trs_listen">Listen</button>
            </div>
        </div>

        <div id="status" class="status" role="status"></div>
    </main>

    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Core layer -->
    <script src="../../core/tg.js"></script>
    <script src="../../core/store.js"></script>
    <script src="../../core/i18n.js"></script>

    <!-- App -->
    <script src="app.js"></script>
</body>
</html>

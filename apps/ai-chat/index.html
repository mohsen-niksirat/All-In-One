<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Chat</title>
    <link rel="stylesheet" href="../../core/ui.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header id="header">
            <div class="header-left">
                <a class="back-btn" href="../../" data-i18n-title="chat_back" title="Back to apps">‹</a>
                <div class="avatar">
                    <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
                        <circle cx="18" cy="18" r="18" fill="var(--accent-color)"/>
                        <text x="18" y="23" text-anchor="middle" fill="white" font-size="18" font-weight="bold">🤖</text>
                    </svg>
                </div>
                <div class="header-info">
                    <h1 data-i18n="chat_title">AI Chat</h1>
                    <span id="status" class="status online" data-i18n="chat_online">Online</span>
                </div>
            </div>
            <div class="header-right">
                <div data-lang-switcher class="lang-switcher"></div>
                <select id="model-select" class="model-select">
                    <option value="llama-3.3-70b-versatile">Llama 3.3 70B</option>
                    <option value="llama-3.1-8b-instant">Llama 3.1 8B</option>
                    <option value="gemma2-9b-it">Gemma 2 9B</option>
                    <option value="mixtral-8x7b-32768">Mixtral 8x7B</option>
                </select>
                <button id="settings-btn" class="icon-btn" data-i18n-title="chat_settings" title="Settings">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                </button>
                <button id="clear-btn" class="icon-btn" data-i18n-title="chat_clear" title="Clear chat">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3 6 5 6 21 6"/>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Messages Area -->
        <div id="messages" class="messages">
            <div id="welcome" class="welcome">
                <div class="welcome-icon">🤖</div>
                <h2 data-i18n="chat_welcome_title">Hi! I'm your AI assistant</h2>
                <p data-i18n="chat_welcome_sub">Ask me anything</p>
                <div class="quick-actions">
                    <button class="quick-btn" data-prompt-key="chat_quick_joke_prompt"><span>😄</span><span data-i18n="chat_quick_joke">A joke</span></button>
                    <button class="quick-btn" data-prompt-key="chat_quick_about_prompt"><span>ℹ️</span><span data-i18n="chat_quick_about">About me</span></button>
                    <button class="quick-btn" data-prompt-key="chat_quick_code_prompt"><span>💻</span><span data-i18n="chat_quick_code">Write code</span></button>
                    <button class="quick-btn" data-prompt-key="chat_quick_date_prompt"><span>📅</span><span data-i18n="chat_quick_date">Date</span></button>
                </div>
            </div>
        </div>

        <!-- Offline send-queue note -->
        <div id="outbox-note" class="outbox-note hidden"></div>

        <!-- Input Area -->
        <div id="input-area" class="input-area">
            <div class="input-wrapper">
                <textarea id="message-input" rows="1" data-i18n-placeholder="chat_input_placeholder" placeholder="Type your message..."></textarea>
                <button id="send-btn" class="send-btn" disabled>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="22" y1="2" x2="11" y2="13"/>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                    </svg>
                </button>
            </div>
            <div class="input-footer">
                <span id="token-count" class="token-count"></span>
                <span id="last-sync" class="last-sync"></span>
                <span class="powered-by" data-i18n="chat_powered"> powered by Groq</span>
            </div>
        </div>

        <!-- Settings Modal -->
        <div id="settings-modal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 data-i18n="chat_settings_title">Settings</h3>
                    <button id="close-modal" class="icon-btn">✕</button>
                </div>
                <div class="modal-body">
                    <div class="setting-group">
                        <label for="api-key-input" data-i18n="chat_api_key_label">Groq API Key</label>
                        <p class="setting-hint" data-i18n="chat_api_key_hint">Get your API key from console.groq.com</p>
                        <input type="password" id="api-key-input" class="setting-input" data-i18n-placeholder="chat_api_key_placeholder" placeholder="gsk_...">
                    </div>
                    <div class="setting-group">
                        <label for="system-prompt" data-i18n="chat_system_prompt">System Prompt</label>
                        <textarea id="system-prompt" class="setting-textarea" rows="3" data-i18n-placeholder="chat_system_prompt_placeholder" placeholder="System instructions..."></textarea>
                    </div>
                    <div class="setting-group">
                        <label for="max-tokens-input" data-i18n="chat_max_tokens">Max tokens</label>
                        <input type="number" id="max-tokens-input" value="1024" min="100" max="4096" class="setting-input">
                    </div>
                    <div class="setting-group">
                        <label data-i18n="chat_data_title">Conversation data</label>
                        <div class="data-actions">
                            <button type="button" id="export-btn" class="save-btn data-btn" data-i18n="chat_export">Export (JSON)</button>
                            <button type="button" id="import-btn" class="save-btn data-btn" data-i18n="chat_import">Import (JSON)</button>
                            <input type="file" id="import-file" accept="application/json,.json" hidden>
                        </div>
                        <p class="setting-hint" data-i18n="chat_data_hint">Backup — queued offline messages are included</p>
                    </div>
                    <button id="save-settings" class="save-btn" data-i18n="chat_save">Save settings</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Core layer -->
    <script src="../../core/tg.js"></script>
    <script src="../../core/store.js"></script>
    <script src="../../core/i18n.js"></script>
    <script src="../../core/backup.js"></script>

    <!-- App Scripts -->
    <script src="groq-api.js"></script>
    <script src="chat.js"></script>
    <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Currency</title>
    <link rel="stylesheet" href="../../core/ui.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <a class="back-btn" href="../../" data-i18n-title="cur_back" title="Back to apps">‹</a>
        <h1 data-i18n="cur_title">Currency</h1>
        <div data-lang-switcher class="lang-switcher"></div>
    </header>

    <main class="app-page">
        <!-- Amount + pair -->
        <div class="amount-row">
            <input id="amount" type="number" inputmode="decimal" min="0" step="any" data-i18n-placeholder="cur_amount_ph" placeholder="Amount">
            <select id="from" class="cur-select" aria-label="From currency" data-i18n-aria-label="cur_from_label"></select>
        </div>
        <div class="swap-row">
            <button id="swap" class="btn btn-secondary" data-i18n="cur_swap">⇄ Swap</button>
        </div>
        <div class="amount-row">
            <div class="amount-result" id="amount-result">1</div>
            <select id="to" class="cur-select" aria-label="To currency" data-i18n-aria-label="cur_to_label"></select>
        </div>

        <button id="convert-btn" class="btn btn-primary btn-block" data-i18n="cur_convert">Convert</button>
        <div id="status" class="status" role="status"></div>

        <!-- Result card -->
        <div id="result" class="result-card hidden">
            <div class="res-line"><span id="res-from" class="res-side"></span></div>
            <div class="res-eq">=</div>
            <div class="res-line"><span id="res-to" class="res-side res-main"></span></div>
            <div class="res-rate" id="res-rate"></div>
        </div>

        <!-- Market ticker: USD/IRR + global gold (XAU) -->
        <div id="market" class="market hidden">
            <div class="m-head">💹 <span data-i18n="cur_market">Market</span></div>
            <div class="m-row">
                <span class="m-label"><span data-i18n="cur_market_usd">US Dollar</span> <b class="m-code">USD/IRR</b></span>
                <span class="m-value" id="m-usd"></span>
            </div>
            <div class="m-row">
                <span class="m-label"><span data-i18n="cur_market_gold">Global gold</span> <b class="m-code">XAU/USD</b></span>
                <span class="m-value" id="m-xau"></span>
            </div>
            <div class="m-row">
                <span class="m-label"><span data-i18n="cur_market_gold">Global gold</span> <b class="m-code">XAU/IRR</b></span>
                <span class="m-value" id="m-xau-irr"></span>
            </div>
            <div class="m-updated hidden" id="m-updated"></div>
            <button id="m-refresh" class="m-refresh" data-i18n="cur_market_refresh">↻ Refresh</button>
        </div>

        <!-- Popular quick pairs -->
        <div id="quick" class="quick hidden"></div>
    </main>

    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Core layer -->
    <script src="../../core/tg.js"></script>
    <script src="../../core/store.js"></script>
    <script src="../../core/i18n.js"></script>

    <!-- App -->
    <script src="app.js"></script>
</body>
</html>

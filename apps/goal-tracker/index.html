<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Goal Tracker</title>
    <link rel="stylesheet" href="../../core/ui.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <a class="back-btn" href="../../" data-i18n-title="goal_back" title="Back to apps">‹</a>
        <h1 data-i18n="goal_title">Goal Tracker</h1>
        <div data-lang-switcher class="lang-switcher"></div>
    </header>

    <main class="app-page">
        <!-- Add goal -->
        <div class="add-form">
            <input id="goal-name" data-i18n-placeholder="goal_name_ph" placeholder="Goal name..." autocomplete="off">
            <div class="add-row2">
                <input type="number" id="goal-target" min="1" step="any" data-i18n-placeholder="goal_target_ph" placeholder="Target" inputmode="decimal">
                <button id="add-btn" class="btn btn-primary" data-i18n="goal_add">Add</button>
            </div>
        </div>

        <!-- Goals -->
        <div id="goal-list" class="goal-list"></div>
    </main>

    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Core layer -->
    <script src="../../core/tg.js"></script>
    <script src="../../core/store.js"></script>
    <script src="../../core/i18n.js"></script>

    <!-- App -->
    <script src="app.js"></script>
</body>
</html>

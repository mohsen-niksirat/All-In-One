<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stopwatch</title>
    <link rel="stylesheet" href="../../core/ui.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <a class="back-btn" href="../../" data-i18n-title="stop_back" title="Back to apps">‹</a>
        <h1 data-i18n="stop_title">Stopwatch</h1>
        <div data-lang-switcher class="lang-switcher"></div>
    </header>

    <main class="app-page">
        <!-- Time display -->
        <div id="time-display" class="time-display">00:00:00.0</div>

        <!-- Controls -->
        <div class="controls">
            <button id="start-btn" class="btn btn-primary btn-big">▶ <span data-i18n="stop_start">Start</span></button>
            <button id="lap-btn" class="btn btn-secondary btn-big" data-i18n="stop_lap">Lap</button>
            <button id="reset-btn" class="btn btn-secondary btn-big" data-i18n="stop_reset">Reset</button>
        </div>

        <!-- Laps -->
        <div class="laps">
            <div class="section-title">
                <span data-i18n="stop_laps">Laps</span>
                <button id="clear-laps" class="clear-btn" data-i18n="stop_clear_laps">Clear laps</button>
            </div>
            <div id="lap-list" class="lap-list"></div>
        </div>
    </main>

    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Core layer -->
    <script src="../../core/tg.js"></script>
    <script src="../../core/store.js"></script>
    <script src="../../core/i18n.js"></script>

    <!-- App -->
    <script src="app.js"></script>
</body>
</html>
